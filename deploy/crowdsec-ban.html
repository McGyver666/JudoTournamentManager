<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Zugriff vorübergehend gesperrt</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f4;
      color: #1c1917;
    }
    main {
      max-width: 32rem;
      margin: 1.5rem;
      padding: 2rem;
      background: #ffffff;
      border-radius: 0.75rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    p {
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Zugriff vorübergehend gesperrt</h1>
    <p>Von diesem Netzwerk wurden auffällige Anfragen erkannt. Der Zugriff auf diese Seite ist deshalb vorübergehend gesperrt.</p>
    <p>Bei Fragen bitte an die Turnierleitung wenden.</p>
  </main>
</body>
</html>
